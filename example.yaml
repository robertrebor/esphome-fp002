# Example ESPHome configuration for the GROW FP002 facial/palm-vein module,
# with add/delete user support exposed as regular device entities in Home
# Assistant (Settings -> Devices & Services -> ESPHome -> this device) - no
# Developer Tools/Actions needed for day-to-day use.
#
# Wiring (module -> ESP32):
#   VCC (pin1)  -> external 5-12V supply (NOT the ESP32's 3.3V pin - check current draw, ~200mA)
#   GND (pin2)  -> common ground with the ESP32
#   TXD (pin3)  -> ESP32 RX pin  (GPIO16 below)
#   RXD (pin4)  -> ESP32 TX pin  (GPIO17 below)
#   IR  (pin5)  -> optional, not used by this component yet
#   VCC (pin6)  -> 3-5V for the IR sensor, if you wire it up
#
# The fp002 component is downloaded from GitHub at compile time (see
# `external_components` below), pinned to a release - change the version
# there to upgrade.

esphome:
  name: fp002-face-recognition

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG   # use VERBOSE if you want to see the live face-position NOTE messages too

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  services:
    # Optional: the same add/delete/delete-all actions as the device entities
    # further down, but callable from an automation/script or Developer Tools
    # -> Actions instead of clicking through the UI. If you only want the
    # entities (the more "user friendly" day-to-day way to manage users), you
    # can delete this whole `api: services:` block - it's independent of them.
    #
    # By default this drives the module's interactive 5-direction enroll (better
    # accuracy - the module's LED blinks green once per captured direction, 3x on
    # completion, red 2x on failure). Set quick=true for a single-photo enroll
    # instead (faster, less robust). Palm vein always uses single-photo, quick or
    # not, since the module has no interactive mode for it.
    - service: add_user
      variables:
        user_name: string
        admin: bool
        palm_vein: bool
        quick: bool
      then:
        - lambda: |-
            id(fp002_module).enroll_user(user_name, admin, palm_vein, quick);

    - service: delete_user
      variables:
        user_id: int
        palm_vein: bool
      then:
        - lambda: |-
            id(fp002_module).delete_user((uint16_t) user_id, palm_vein);

    # Careful - wipes every enrolled user. type: 0=all, 1=face only, 2=palm only, 3=general.
    - service: delete_all_users
      variables:
        type: int
      then:
        - lambda: |-
            id(fp002_module).delete_all_users((uint8_t) type);

ota:
  platform: esphome

external_components:
  - source: github://robertrebor/esphome-fp002@v1.0.2
    components: [fp002]

uart:
  id: fp002_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

fp002:
  id: fp002_module
  uart_id: fp002_uart
  auto_verify: true       # keep re-issuing MID_VERIFY so recognition runs continuously
  verify_timeout: 5       # seconds the module waits for a face per verify attempt (max 255)
  enroll_timeout: 15      # seconds the module waits for a face per enroll attempt (max 255)
  cooldown: 2s            # pause between attempts

  # --- entities, remove any you don't want ---
  face_recognized_binary_sensor:
    name: "Face Recognized"
  recognized_user_name:
    name: "Recognized User Name"
  recognized_user_id:
    name: "Recognized User Id"
  registered_user_ids:
    name: "Registered User Ids"      # comma-separated list, e.g. "1,4,9,10"
  registered_user_count:
    name: "Registered User Count"

  # --- automations ---
  on_ready:
    - logger.log: "FP002 module is ready"
  on_face_recognized:
    - logger.log:
        format: "Recognized user %u (%s), admin=%d"
        args: ["user_id", "user_name.c_str()", "admin"]
    # Example for later, once you decide on an action:
    # - switch.turn_on: door_relay
  on_face_rejected:
    - logger.log:
        format: "Verify attempt finished without a match (reason=0x%02X)"
        args: ["reason"]

  on_enroll_success:
    - logger.log:
        format: "Enrolled new user %u: %s (admin=%d)"
        args: ["user_id", "user_name.c_str()", "admin"]
  on_enroll_failed:
    - logger.log:
        format: "Enroll failed (reason=0x%02X)"
        args: ["reason"]

  on_delete_success:
    - logger.log:
        format: "Deleted user %u"
        args: ["user_id"]
  on_delete_failed:
    - logger.log:
        format: "Delete of user %u failed (reason=0x%02X)"
        args: ["user_id", "reason"]
  on_delete_all_success:
    - logger.log: "All matching users deleted"

# You can also call these from any other automation/lambda, e.g. a physical
# button on the ESP32 itself, without going through Home Assistant at all:
#   id(fp002_module).start_verify();
#   id(fp002_module).enroll_user("Robert", false, false);         // name, admin, palm_vein -> interactive 5-direction
#   id(fp002_module).enroll_user("Robert", false, false, true);   // ... add quick=true for single-photo instead
#   id(fp002_module).delete_user(4, false);                 // user_id, palm_vein
#   id(fp002_module).delete_all_users(0);                   // 0=all
#   id(fp002_module).refresh_user_list();
#   id(fp002_module).reset_module();

# --- Add/delete users as regular device entities, no Developer Tools/Actions
# needed. These show up under Settings -> Devices & Services -> ESPHome ->
# this device (and on its device page/dashboard card) right alongside
# Registered User Ids/Count above, same as any other entity - fill in the
# text box, flip the toggles you need, press the button. This is the
# recommended way to manage users day to day; the `api: services:` block
# above is still there if you'd rather drive this from an automation/script.

text:
  - platform: template
    name: "New User Name"
    id: new_user_name
    icon: "mdi:account-plus"
    mode: text
    optimistic: true

switch:
  - platform: template
    name: "New User Is Admin"
    id: new_user_admin
    icon: "mdi:shield-account"
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "New User Is Palm Vein"
    id: new_user_palm_vein
    icon: "mdi:hand-back-right"
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "New User Quick Enroll (single photo)"
    id: new_user_quick
    icon: "mdi:camera-timer"
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Delete User Is Palm Vein"
    id: delete_user_palm_vein
    icon: "mdi:hand-back-right"
    optimistic: true
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    name: "Delete User Id"
    id: delete_user_id_number
    icon: "mdi:account-remove"
    min_value: 1
    max_value: 800
    step: 1
    mode: box
    optimistic: true

select:
  - platform: template
    name: "Delete All Users - Which"
    id: delete_all_type
    icon: "mdi:account-multiple-remove"
    optimistic: true
    options:
      - "All users"
      - "Face users only"
      - "Palm-vein users only"
      - "General users only"
    initial_option: "All users"

button:
  - platform: template
    name: "Enroll New User"
    icon: "mdi:account-plus"
    on_press:
      - lambda: |-
          id(fp002_module).enroll_user(id(new_user_name).state, id(new_user_admin).state,
                                        id(new_user_palm_vein).state, id(new_user_quick).state);

  - platform: template
    name: "Delete User By Id"
    icon: "mdi:account-remove"
    on_press:
      - lambda: |-
          id(fp002_module).delete_user((uint16_t) id(delete_user_id_number).state,
                                        id(delete_user_palm_vein).state);

  - platform: template
    name: "Delete ALL Users"
    icon: "mdi:account-multiple-remove"
    # Careful - wipes every enrolled user matching the selected type, no
    # confirmation dialog on the ESP32 side. (A future version of this
    # component could gate this behind a second "arm" switch if that's
    # something you'd want - easy to add.)
    on_press:
      - lambda: |-
          // Option index == module type: 0=all, 1=face, 2=palm, 3=general.
          // (select .state was removed in ESPHome 2026.x - use active_index().)
          auto idx = id(delete_all_type).active_index();
          uint8_t type = idx.has_value() ? (uint8_t) idx.value() : 0;
          id(fp002_module).delete_all_users(type);
